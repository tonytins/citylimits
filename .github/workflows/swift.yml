# Builds and tests CityLimits on Linux, the only platform it builds on for now.

name: Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
        with:
          # GitVersion counts the commits since GitVersion.txt changed, so it needs the history.
          fetch-depth: 0
      - name: Trust the checkout
        # The container runs as another user than the one that checked the repository out.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install raylib's X11 and GL headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev
      - run: swift build
      - run: swift test
      - name: Run a city for a year with no window
        run: swift run citylimits --headless --ticks 768
      - name: Run the demo town
        run: swift run citylimits scenario demo-town --headless
